<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Transferencias</title>
    <link rel="stylesheet" href="/static/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h1>Control de Transferencias</h1>
<p id="mensaje" style="color: green;"></p>

<h2>Cuenta</h2>

<select id="persona" onchange="cambiarPersona()">
    <option value="Carlos">Carlos</option>
    <option value="Pito">Pito</option>
</select>

<h2>Filtrar por mes</h3>

<input type="month" id="filtro-mes">
<button onclick="aplicarFiltro()">Aplicar filtro</button>
<button onclick="limpiarFiltro()">Mes actual</button>


<h2>Resumen</h2>

<p>Total: <span id="total">0</span> €</p>
<p>Objetivo: <span id="objetivo">0</span> €</p>
<p>Restante: <span id="restante">0</span> €</p>

<h3>Actualizar objetivo</h3>

<input type="number" id="nuevo-objetivo" placeholder="Nuevo objetivo">
<button onclick="guardarObjetivo()">Guardar objetivo</button>

<h3>Progreso</h3>

<div id="barra-container">
    <div id="barra-progreso"></div>
</div>

<p id="texto-progreso"></p>

<h2>Agregar transferencia</h2>

<input type="number" id="monto" placeholder="Monto"><br><br>
<input type="date" id="fecha"><br><br>
<input type="text" id="descripcion" placeholder="Descripción"><br><br>

<button onclick="agregarTransferencia()">Agregar</button>

<h2>Historial</h2>
<ul id="lista-transferencias"></ul>

<script>
let personaSeleccionada = "Carlos";

function cambiarPersona() {
    const select = document.getElementById("persona");
    personaSeleccionada = select.value;

    cargarResumen();
    cargarTransferencias();
}

function ponerFechaHoy() {
    const hoy = new Date();

    const year = hoy.getFullYear();
    const month = String(hoy.getMonth() + 1).padStart(2, '0');
    const day = String(hoy.getDate()).padStart(2, '0');

    const fechaFormateada = `${year}-${month}-${day}`;

    document.getElementById("fecha").value = fechaFormateada;
}

let mesSeleccionado = null;

function aplicarFiltro() {
    const input = document.getElementById("filtro-mes").value;

    if (!input) return;

    mesSeleccionado = input; // formato: "2026-04"

    cargarResumen();
    cargarTransferencias();
}

function limpiarFiltro() {
    mesSeleccionado = null;

    document.getElementById("filtro-mes").value = ""; // 🔥 FIX

    cargarResumen();
    cargarTransferencias();
}


async function cargarResumen() {
    let url = "/resumen";

    if (mesSeleccionado) {
        url += "?mes=" + mesSeleccionado;
    }

    const respuesta = await fetch(url);
    const data = await respuesta.json();

    document.getElementById("total").innerText = data.total;
    document.getElementById("objetivo").innerText = data.objetivo;
    document.getElementById("restante").innerText = data.restante;

    let porcentaje = data.objetivo > 0 
        ? (data.total / data.objetivo) * 100 
        : 0;

    if (porcentaje > 100) porcentaje = 100;

    const barra = document.getElementById("barra-progreso");
    barra.style.width = porcentaje + "%";

    if (porcentaje < 40) {
        barra.style.backgroundColor = "red";
    } else if (porcentaje < 80) {
        barra.style.backgroundColor = "orange";
    } else {
        barra.style.backgroundColor = "green";
    }

    document.getElementById("texto-progreso").innerText = 
        `${data.total}€ / ${data.objetivo}€`;
}

async function cargarTransferencias() {
    const respuesta = await fetch("/transferencias");
    const data = await respuesta.json();

    const lista = document.getElementById("lista-transferencias");
    lista.innerHTML = "";

    data.forEach(t => {
        if (mesSeleccionado) {
            if (!t.fecha.startsWith(mesSeleccionado)) return;
        }

        const item = document.createElement("li");

        item.innerHTML = `
            <span>${t.monto}€ | ${t.fecha} | ${t.descripcion}</span>
            <button class="btn-eliminar" onclick="eliminarTransferencia(${t.id})">X</button>
        `;

        lista.appendChild(item);
    });
} //

async function agregarTransferencia() {
    const monto = document.getElementById("monto").value;
    const fecha = document.getElementById("fecha").value;
    const descripcion = document.getElementById("descripcion").value;

    const mensaje = document.getElementById("mensaje");
    mensaje.innerText = "";

    if (!monto || !fecha) {
        mensaje.style.color = "red";
        mensaje.innerText = "Monto y fecha son obligatorios";
        return;
    }

    try {
        const response = await fetch("/transferencias", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                monto: parseFloat(monto),
                fecha: fecha,
                descripcion: descripcion,
                persona: personaSeleccionada
            })
        });

        const data = await response.json();

        if (!response.ok) {
            mensaje.style.color = "red";
            mensaje.innerText = data.error || "Error al agregar transferencia";
            setTimeout(() => mensaje.innerText = "", 3000);
            return;
        }

        mensaje.style.color = "green";
        mensaje.innerText = "Transferencia agregada correctamente";

        setTimeout(() => mensaje.innerText = "", 3000);

        document.getElementById("monto").value = "";
        ponerFechaHoy();
        document.getElementById("descripcion").value = "";

        mesSeleccionado = null;
        document.getElementById("filtro-mes").value = "";

        cargarResumen();
        cargarTransferencias();

    } catch (error) {
        mensaje.style.color = "red";
        mensaje.innerText = "Error de conexión";
        setTimeout(() => mensaje.innerText = "", 3000);
    }
}

async function eliminarTransferencia(id) {
    const confirmar = confirm("¿Eliminar esta transferencia?");
    if (!confirmar) return;

    await fetch(`/transferencias/${id}`, {
        method: "DELETE"
    });

    const mensaje = document.getElementById("mensaje");
    mensaje.style.color = "green";
    mensaje.innerText = "Transferencia eliminada";

    setTimeout(() => mensaje.innerText = "", 3000);

    cargarResumen();
    cargarTransferencias();
}

async function guardarObjetivo() {
    const objetivo = document.getElementById("nuevo-objetivo").value;
    const mensaje = document.getElementById("mensaje");

    mensaje.innerText = "";

    if (!objetivo || objetivo <= 0) {
        mensaje.style.color = "red";
        mensaje.innerText = "Objetivo inválido";
        setTimeout(() => mensaje.innerText = "", 3000);
        return;
    }

    try {
        const response = await fetch("/objetivo", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ objetivo: parseFloat(objetivo) })
        });

        const data = await response.json();

        if (!response.ok) {
            mensaje.style.color = "red";
            mensaje.innerText = data.error || "Error al guardar objetivo";
            setTimeout(() => mensaje.innerText = "", 3000);
            return;
        }

        mensaje.style.color = "green";
        mensaje.innerText = "Objetivo actualizado";

        setTimeout(() => mensaje.innerText = "", 3000);

        document.getElementById("nuevo-objetivo").value = "";

        cargarResumen();

    } catch (error) {
        mensaje.style.color = "red";
        mensaje.innerText = "Error de conexión";
        setTimeout(() => mensaje.innerText = "", 3000);
    }
}

cargarResumen();
cargarTransferencias();
ponerFechaHoy();

</script>

</body>
</html>
