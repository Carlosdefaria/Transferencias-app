<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Transferencias</title>
    <link rel="stylesheet" href="/static/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- LOGIN -->
<div id="login-container" class="login">
    <h2>Acceso</h2>
    <input type="password" id="pin" placeholder="Introduce PIN">
    <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="container">

    <h1>Control de Transferencias</h1>
    <p id="mensaje"></p>

    <p class="usuario-activo">
    Estás viendo: <strong id="nombre-usuario">Carlos</strong>
    </p>

    <div class="card">
        <h2>Cuenta</h2>
        <select id="persona" onchange="cambiarPersona()">
            <option value="Carlos">Carlos</option>
            <option value="Pito">Pito</option>
        </select>
    </div>

    <div class="card">
        <h2>Filtrar por mes</h2>
        <input type="month" id="filtro-mes">
        <button onclick="aplicarFiltro()">Aplicar filtro</button>
        <button class="secondary" onclick="limpiarFiltro()">Mes actual</button>
    </div>

    <div class="card">
        <h2>Resumen</h2>
        <p>Total confirmado: <span id="confirmado">0</span> €</p>
        <p>Objetivo a alcanzar: <span id="objetivo">0</span> €</p>
        <p>Restante para llegar al objetivo: <span id="restante">0</span> €</p>
        <p>Transferencias hechas aun no recibidas: <span id="pendiente">0</span> €</p>

        <h3>Actualizar objetivo</h3>
        <input type="number" id="nuevo-objetivo" placeholder="Nuevo objetivo">
        <button onclick="guardarObjetivo()">Guardar objetivo</button>

        <h3>Progreso</h3>
        <div id="barra-container">
            <div id="barra-progreso"></div>
        </div>
        <p id="texto-progreso"></p>
    </div>

    <div class="card">
        <h2>Agregar transferencia</h2>
        <input type="number" id="monto" placeholder="Monto">
        <input type="date" id="fecha">
        <input type="text" id="descripcion" placeholder="Descripción">
        <button onclick="agregarTransferencia()">Agregar</button>
    </div>

    <div class="card">
        <h2>Historial</h2>
        <ul id="lista-transferencias"></ul>
    </div>

</div>
</div>

<script>

function login() {
    const pin = document.getElementById("pin").value;

    if (pin === "1234") {
        document.getElementById("login-container").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else {
        alert("PIN incorrecto");
    }
}

function formatearDinero(valor) {
    return new Intl.NumberFormat('es-ES', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }).format(valor || 0);
}

function getPersonaSeleccionada() {
    return document.getElementById("persona").value;
}

let personaSeleccionada = "Carlos";

function cambiarPersona() {
    const select = document.getElementById("persona");
    personaSeleccionada = select.value;

    document.getElementById("nombre-usuario").innerText = personaSeleccionada;

    cargarResumen();
    cargarTransferencias();
}

function ponerFechaHoy() {
    const hoy = new Date();

    const year = hoy.getFullYear();
    const month = String(hoy.getMonth() + 1).padStart(2, '0');
    const day = String(hoy.getDate()).padStart(2, '0');

    document.getElementById("fecha").value = `${year}-${month}-${day}`;
}

let mesSeleccionado = null;

function aplicarFiltro() {
    const input = document.getElementById("filtro-mes").value;
    if (!input) return;

    mesSeleccionado = input;
    cargarResumen();
    cargarTransferencias();
}

function limpiarFiltro() {
    mesSeleccionado = null;
    document.getElementById("filtro-mes").value = "";
    cargarResumen();
    cargarTransferencias();
}

async function cargarResumen() {
    let persona = getPersonaSeleccionada();
    let url = `/resumen?persona=${persona}`;

    if (mesSeleccionado) {
        url += `&mes=${mesSeleccionado}`;
    }

    const respuesta = await fetch(url);
    const data = await respuesta.json();

    document.getElementById("confirmado").innerText = formatearDinero(data.total_confirmado);
    document.getElementById("objetivo").innerText = formatearDinero(data.objetivo);
    document.getElementById("restante").innerText = formatearDinero(data.restante);
    document.getElementById("pendiente").innerText = formatearDinero(data.pendiente);

    // 🔥 color restante
    const restanteElem = document.getElementById("restante");
    restanteElem.style.color = data.restante <= 0 ? "green" : "red";
    document.getElementById("pendiente").style.color = "orange";

    let porcentaje = data.objetivo > 0 
        ? (data.total_confirmado / data.objetivo) * 100 
        : 0;

    if (porcentaje > 100) porcentaje = 100;

    const barra = document.getElementById("barra-progreso");
    barra.style.width = porcentaje + "%";

    if (porcentaje < 40) {
        barra.style.backgroundColor = "red";
    } else if (porcentaje < 80) {
        barra.style.backgroundColor = "orange";
    } else {
        barra.style.backgroundColor = "green";
    }

    document.getElementById("texto-progreso").innerText =
        `${formatearDinero(data.total_confirmado)}€ / ${formatearDinero(data.objetivo)}€`;
}

async function cargarTransferencias() {
    const persona = getPersonaSeleccionada();
    const respuesta = await fetch(`/transferencias?persona=${persona}`);
    const data = await respuesta.json();

    const lista = document.getElementById("lista-transferencias");
    lista.innerHTML = "";

    data.forEach(t => {
        if (mesSeleccionado && !t.fecha.startsWith(mesSeleccionado)) return;

        const item = document.createElement("li");

        const fecha = new Date(t.fecha).toLocaleDateString("es-ES");

        item.innerHTML = `
            <span>
                <strong>${formatearDinero(t.monto)}€</strong> — ${fecha}<br>
                <small>${t.descripcion || "Sin descripción"}</small>
            </span>

            <div style="display:flex; gap:5px;">
                <button onclick="toggleConfirmar(${t.id})">
                    ${t.confirmada ? "Desconfirmar" : "Confirmar"}
                </button>

                    ${!t.confirmada ? `
                        <button class="btn-eliminar" onclick="eliminarTransferencia(${t.id})">X</button>
                    ` : ""}
            </div>
        `;

        // 🔥 COLOR VERDE SI ESTÁ CONFIRMADA
        if (t.confirmada) {
            item.style.backgroundColor = "#d4edda";
        }

        lista.appendChild(item);
    });
}


async function agregarTransferencia() {
    const monto = document.getElementById("monto").value;
    const fecha = document.getElementById("fecha").value;
    const descripcion = document.getElementById("descripcion").value;

    const mensaje = document.getElementById("mensaje");
    mensaje.innerText = "";

    if (!monto || !fecha) {
        mensaje.className = "mensaje error";
        mensaje.innerText = "Monto y fecha son obligatorios";

        setTimeout(() => {
            mensaje.innerText = "";
            mensaje.className = "";
        }, 4000);
           
        return;
    }

    try {
        const response = await fetch("/transferencias", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                monto: parseFloat(monto),
                fecha,
                descripcion,
                persona: getPersonaSeleccionada()
            })
        });

        const data = await response.json();

        if (!response.ok) {
            mensaje.className = "mensaje error";
            mensaje.innerText = data.error || "Error";
            return;
        }

        mensaje.className = "mensaje exito";
        mensaje.innerText = "Transferencia agregada correctamente";

        setTimeout(() => {
            mensaje.innerText = "";
            mensaje.className = "";
        }, 4000);

        document.getElementById("monto").value = "";
        ponerFechaHoy();
        document.getElementById("descripcion").value = "";

        document.getElementById("monto").focus();

        mesSeleccionado = null;
        document.getElementById("filtro-mes").value = "";

        cargarResumen();
        cargarTransferencias();

    } catch (error) {
        mensaje.className = "mensaje error";
        mensaje.innerText = "Error de conexión";

        setTimeout(() => {
            mensaje.innerText = "";
            mensaje.className = "";
        }, 4000);
    }
}


async function eliminarTransferencia(id) {
    if (!confirm("¿Eliminar esta transferencia?")) return;

    await fetch(`/transferencias/${id}`, { method: "DELETE" });

    cargarResumen();
    cargarTransferencias();
}

async function toggleConfirmar(id) {
    await fetch(`/transferencias/${id}/confirmar`, {
        method: "PATCH"
    });

    cargarTransferencias();
    cargarResumen();
}


async function guardarObjetivo() {
    const objetivo = document.getElementById("nuevo-objetivo").value;
    const mensaje = document.getElementById("mensaje");

    if (!objetivo || objetivo <= 0) {
        mensaje.className = "mensaje error";
        mensaje.innerText = "Objetivo inválido";
        
        setTimeout(() => {
            mensaje.innerText = "";
            mensaje.className = "";
        }, 4000);
        return;
    }

    try {
        const response = await fetch("/objetivo", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                objetivo: parseFloat(objetivo),
                persona: getPersonaSeleccionada()
            })
        });

        if (!response.ok) {
            mensaje.className = "mensaje error";
            mensaje.innerText = "Error al guardar objetivo";
            return;
        }

        mensaje.className = "mensaje exito";
        mensaje.innerText = "Objetivo actualizado";

        document.getElementById("nuevo-objetivo").value = "";

        cargarResumen();

    } catch {
        mensaje.className = "mensaje error";
        mensaje.innerText = "Error de conexión";
    }
}

cargarResumen();
cargarTransferencias();
ponerFechaHoy();

</script>

</body>
</html>
